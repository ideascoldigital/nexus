name: Bump Homebrew tap

# Tells ideascoldigital/homebrew-tap to point its nexus cask at this release.
#
# Triggered by publishing, not by the build: release-native.yml attaches its
# bundles to a *draft* release, and a draft is invisible to both the anonymous
# download and brew livecheck, so a bump fired at build time would fail. The tap
# ignores a version it already carries, so re-publishing is harmless.

on:
  release:
    types: [published]

permissions: {}

jobs:
  bump:
    # A prerelease is not what `brew install --cask nexus` should hand people.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the tap bump
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TAP_TOKEN" \
            https://api.github.com/repos/ideascoldigital/homebrew-tap/dispatches \
            -d "$(jq -nc --arg v "${TAG#v}" \
                  '{event_type:"bump",client_payload:{app:"nexus",version:$v}}')"
          echo "Asked the tap to bump nexus to ${TAG#v}"
