[package]
name = "nexux"
version = "0.1.7"
description = "Nexus desktop shell"
authors = ["Ideascol"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Job objects: the only way to guarantee the node sidecar dies with the app.
# `RunEvent::Exit` covers a normal quit, but a TerminateProcess (Task Manager,
# a crash, an installer closing the app) runs no handler — and the surviving
# sidecar then holds port 3030 and a file lock on its own node_modules, which
# breaks the next install. See lib.rs `adopt_into_kill_on_close_job`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
